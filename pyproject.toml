[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maiml-domain"
version = "0.1.0"
description = "Python domain model for MaiML (JIS K 0200 / MaiML-Schema-1_0) -- one class per XSD-defined type, the shared foundation MaiML-Library language SDKs build on."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "MaiML-Library" },
]
keywords = ["maiml", "jis-k-0200", "xml", "domain-model", "measurement", "analysis-instrument"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/MaiML-Library/MaiML-Domain"
Organization = "https://github.com/MaiML-Library"

[tool.setuptools.packages.find]
include = ["maiml_domain*"]
